{% extends "base.html" %}
{% block title %}{% block page_title %}Create Account{% endblock %} — CareBoard{% endblock %}

{% block body %}
<div class="reg">
  <header class="reg__header">
    <a href="{% url 'home' %}" class="reg__brand">
      <span class="reg__mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/></svg>
      </span>
      <span class="reg__name">CareBoard</span>
      <span class="reg__by">by CuraRecord</span>
    </a>
    {% block header_right %}<p class="reg__signin">Already have an account? <a href="{% url 'login' %}">Sign In</a></p>{% endblock %}
  </header>

  <main class="reg__card{% block card_class %}{% endblock %}">
    {% block card %}{% endblock %}
  </main>
</div>
{% endblock %}
