<div class="vcard{% if field.errors %} has-error{% endif %}">
  <div class="vcard__top">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    <span class="hint" data-hint-for="{{ badge }}" hidden></span>
  </div>
  <div class="vcard__row">{{ field }}<span class="vcard__unit">{{ unit }}</span></div>
  {% for error in field.errors %}<p class="ik__err">{{ error }}</p>{% endfor %}
</div>
